---
layout: default
---

<article class="game-page">

    <div class="game-header">
        {% if page.cover %}
        <img class="game-cover" src="{{ page.cover }}" alt="Cover {{ page.title }}">
        {% endif %}

        <div class="game-info">
            <h2>{{ page.title }}</h2>
            <p>{{ page.description }}</p>

            <h3>Plateformes</h3>
            <ul>
                {% for p in page.platforms %}
                <li>{{ p }}</li>
                {% endfor %}
            </ul>

            <p><strong>Statut :</strong> {{ page.status }}</p>

            {% if page.privacy_policy %}
            <p class="privacy-link">
                🔒 <a href="{{ page.privacy_policy }}">Privacy Policy</a>
            </p>
            {% endif %}
        </div>
    </div>

    <hr>

    <div class="game-content">
        {{ content }}
    </div>

</article>
