---
layout: default
---

<article class="game-page">

  <div class="game-head">
    <img class="game-art" src="{{ page.cover | relative_url }}" alt="{{ page.title }} logo">
    <div class="game-meta">
      <h1 class="game-title">{{ page.title }}</h1>
      <p class="game-short">{{ page.description }}</p>

      <p><strong>Plateformes :</strong> {{ page.platforms | join: ", " }}</p>
      <p><strong>Statut :</strong> {{ page.status }}</p>

      {% if page.privacy_policy %}
      <p class="game-privacy">🔒 <a href="{{ page.privacy_policy | relative_url }}">Privacy Policy</a></p>
      {% endif %}
    </div>
  </div>

  <section class="game-body">
    {{ content }}
  </section>

</article>
